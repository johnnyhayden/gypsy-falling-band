<!-- Tab mark: the wildflower from the logo's wreath, reduced to what survives at
     16px — eight petals, a gold heart, on the site's noir so it reads against a
     light or a dark tab strip. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <circle cx="16" cy="16" r="16" fill="#0b0810" />
  <g fill="#e9be44">
    <g>
      <ellipse cx="16" cy="8.4" rx="3.05" ry="6.1" />
      <ellipse cx="16" cy="8.4" rx="3.05" ry="6.1" transform="rotate(45 16 16)" />
      <ellipse cx="16" cy="8.4" rx="3.05" ry="6.1" transform="rotate(90 16 16)" />
      <ellipse cx="16" cy="8.4" rx="3.05" ry="6.1" transform="rotate(135 16 16)" />
      <ellipse cx="16" cy="8.4" rx="3.05" ry="6.1" transform="rotate(180 16 16)" />
      <ellipse cx="16" cy="8.4" rx="3.05" ry="6.1" transform="rotate(225 16 16)" />
      <ellipse cx="16" cy="8.4" rx="3.05" ry="6.1" transform="rotate(270 16 16)" />
      <ellipse cx="16" cy="8.4" rx="3.05" ry="6.1" transform="rotate(315 16 16)" />
    </g>
  </g>
  <circle cx="16" cy="16" r="4.4" fill="#0b0810" />
  <circle cx="16" cy="16" r="3.4" fill="#d4a017" />
</svg>
